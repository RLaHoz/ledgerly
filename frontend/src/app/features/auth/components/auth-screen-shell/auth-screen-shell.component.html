<section class="auth-screen-shell">
  <div class="auth-screen-shell__phone">
    <header class="auth-screen-shell__topbar" [class.auth-screen-shell__topbar--compact]="compactTopBar()">
      @if (showBackButton()) {
        <a
          class="auth-screen-shell__back"
          [routerLink]="backLink()"
          aria-label="Go back"
          (click)="onBack()"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M11.667 4.167L5.833 10l5.834 5.833" />
          </svg>
        </a>
      }
    </header>

    <div class="auth-screen-shell__content">
      <div class="auth-screen-shell__inner">
        <div class="auth-screen-shell__logo" [style.marginBottom]="brandMarginBottom()">
          <app-auth-brand-mark />
        </div>

        <h1 class="auth-screen-shell__title">{{ title() }}</h1>

        @if (subtitle(); as subtitle) {
          <p class="auth-screen-shell__subtitle">{{ subtitle }}</p>
        }

        <ng-content />
      </div>
    </div>
  </div>
</section>

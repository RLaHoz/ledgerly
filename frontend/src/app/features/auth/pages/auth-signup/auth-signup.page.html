<app-auth-screen-shell
  title="Welcome"
  subtitle="Continue with Google to access your Ledgerly account"
>
  <div class="auth-actions">
    <button type="button" class="auth-button auth-button--disabled" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M16.365 1.43c0 1.14-.416 2.227-1.247 3.259-.99 1.226-2.188 1.937-3.49 1.832a4.421 4.421 0 0 1-.033-.542c0-1.093.475-2.263 1.32-3.237.423-.497.963-.91 1.62-1.237.655-.322 1.272-.5 1.85-.535-.013.154-.02.308-.02.46Zm3.988 18.437c-.37.855-.755 1.64-1.16 2.346-.553.97-1.005 1.641-1.36 2.014-.548.612-1.134.927-1.758.949-.447 0-1-.13-1.648-.395-.651-.264-1.248-.395-1.79-.395-.57 0-1.18.131-1.834.395-.655.265-1.183.403-1.584.417-.597.028-1.197-.299-1.8-.981-.384-.4-.857-1.095-1.42-2.084-.604-1.053-1.1-2.274-1.49-3.658-.417-1.495-.626-2.944-.626-4.348 0-1.607.347-2.993 1.04-4.156.543-.932 1.268-1.668 2.174-2.205.907-.537 1.886-.81 2.938-.823.475 0 1.099.147 1.87.44.769.293 1.263.44 1.479.44.162 0 .711-.172 1.646-.513.884-.316 1.63-.447 2.239-.395 1.65.134 2.89.783 3.72 1.948-1.476.894-2.208 2.146-2.195 3.75.012 1.25.467 2.288 1.365 3.114.407.383.86.68 1.362.889a11.19 11.19 0 0 1-.356 1.252Z" />
      </svg>
      <span>Continue with Apple</span>
    </button>

    <button type="button" class="auth-button" [disabled]="isLoading()" (click)="continueWithGoogle()">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="auth-button__google-icon">
        <path fill="#EA4335" d="M12.24 10.285v3.821h5.445c-.24 1.229-.96 2.27-2.04 2.97l3.3 2.56c1.92-1.77 3.03-4.38 3.03-7.49 0-.72-.06-1.41-.18-2.08h-9.555Z"/>
        <path fill="#4285F4" d="M12.24 22c2.73 0 5.01-.9 6.68-2.44l-3.3-2.56c-.9.6-2.07.96-3.38.96-2.61 0-4.83-1.77-5.625-4.14H3.21v2.64A10.08 10.08 0 0 0 12.24 22Z"/>
        <path fill="#FBBC05" d="M6.615 13.82A6.07 6.07 0 0 1 6.3 12c0-.63.105-1.23.315-1.82V7.54H3.21A10.18 10.18 0 0 0 2.16 12c0 1.64.39 3.18 1.05 4.46l3.405-2.64Z"/>
        <path fill="#34A853" d="M12.24 6.04c1.47 0 2.79.51 3.825 1.5l2.865-2.865C17.25 3.11 14.97 2 12.24 2A10.08 10.08 0 0 0 3.21 7.54l3.405 2.64c.795-2.37 3.015-4.14 5.625-4.14Z"/>
      </svg>
      <span>{{ isLoading() ? 'Connecting to Google' : 'Continue with Google' }}</span>
    </button>

    <button type="button" class="auth-button auth-button--disabled" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6.75h16a1.25 1.25 0 0 1 1.25 1.25v8A1.25 1.25 0 0 1 20 17.25H4A1.25 1.25 0 0 1 2.75 16V8A1.25 1.25 0 0 1 4 6.75Zm0 1.5v.255L12 13.73l8-5.225V8.25H4Zm16 7.5V10.29l-7.59 4.96a.75.75 0 0 1-.82 0L4 10.29v5.46h16Z" />
      </svg>
      <span>Continue with Email</span>
    </button>
  </div>

  @if (authStore.isError() && authStore.error(); as errorMessage) {
    <p class="auth-error">{{ errorMessage }}</p>
  }

  <footer class="auth-footer">
    <p>
      By continuing, you agree to our
      <button type="button">Terms</button>
      &amp;
      <button type="button">Privacy</button>
    </p>
  </footer>
</app-auth-screen-shell>

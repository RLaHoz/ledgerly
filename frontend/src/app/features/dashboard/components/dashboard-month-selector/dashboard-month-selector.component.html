<header class="dashboard-month-selector" aria-label="Month selector">
  <button
    class="dashboard-month-arrow"
    type="button"
    aria-label="Previous month"
    (click)="previousMonth.emit()"
  >
    <ion-icon name="chevron-back-outline"></ion-icon>
  </button>

  <h2 class="dashboard-month-label">{{ monthLabel() }}</h2>

  <button
    class="dashboard-month-arrow"
    type="button"
    aria-label="Next month"
    (click)="nextMonth.emit()"
  >
    <ion-icon name="chevron-forward-outline"></ion-icon>
  </button>
</header>

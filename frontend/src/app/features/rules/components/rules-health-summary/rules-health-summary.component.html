<article class="rules-summary-card" aria-label="Rules health summary">
  <header class="rules-summary-header">
    <span class="rules-summary-icon" aria-hidden="true">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
    </span>

    <div class="rules-summary-copy">
      <h2>{{ title() }}</h2>
      <p>{{ subtitle() }}</p>
    </div>
  </header>

  <section class="rules-summary-grid">
    @for (stat of stats(); track stat.id) {
      <article class="rules-summary-stat">
        <p class="rules-summary-stat-label">{{ stat.label }}</p>
        <p class="rules-summary-stat-value">{{ stat.value }}</p>
        <p class="rules-summary-stat-subtext" [class.success]="stat.tone === 'success'">
          {{ stat.subtext }}
        </p>
      </article>
    }
  </section>
</article>
